<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>视频连接测试 · sphr</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 28px 20px; background: #111; color: #eee; font: 15px/1.7 -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; }
  main { max-width: 760px; margin: 0 auto; }
  h1 { font-size: 22px; font-weight: 500; }
  p { color: #bbb; }
  .choices { display: flex; flex-wrap: wrap; gap: 12px; margin: 24px 0; }
  button { padding: 12px 16px; border: 1px solid #555; border-radius: 4px; background: none; color: #eee; font: inherit; cursor: pointer; }
  button[aria-pressed="true"] { background: #eee; color: #111; }
  video { display: block; width: 100%; aspect-ratio: 16/9; background: #000; }
  a { color: #ddd; }
  pre { white-space: pre-wrap; overflow-wrap: anywhere; color: #bbb; font-size: 12px; }
</style>
<main>
  <h1>视频连接测试</h1>
  <p>同一支 361° 影片，两种加载方式。先试「分段播放」，再试「MP4 播放」。此页没有其他图片或视频下载。</p>
  <div class="choices" role="group" aria-label="选择加载方式">
    <button data-mode="hls" aria-pressed="false">分段播放（iPhone）</button>
    <button data-mode="mp4" aria-pressed="false">MP4 播放</button>
  </div>
  <video controls playsinline preload="none" aria-label="361 影片连接测试"></video>
  <p id="status" role="status">点击上方按钮开始。</p>
  <p><a href="./assets/films/361.mp4">单独打开 MP4</a></p>
  <details><summary>连接详情</summary><pre id="report"></pre></details>
</main>
<script>
  const video = document.querySelector('video');
  const status = document.querySelector('#status');
  const report = document.querySelector('#report');
  const supportsHls = Boolean(video.canPlayType('application/vnd.apple.mpegurl'));
  let mode = '', started = 0, attempt = 0, timer, events = [], failure = '';
  function refresh() {
    report.textContent = [
      'sphr 视频连接检查 v1',
      '方式：' + (mode || '未选择'),
      '原生分段支持：' + supportsHls,
      '播放位置：' + video.currentTime.toFixed(2) + ' 秒',
      '已缓冲：' + (video.buffered.length ? video.buffered.end(video.buffered.length - 1).toFixed(2) : '0') + ' 秒',
      '影片信息：' + (video.readyState ? '已收到' : '未收到'),
      '连接状态：' + video.networkState,
      '错误：' + (failure || video.error?.code || '无'),
      '事件：' + events.join(' → ')
    ].join('\n');
  }
  function play(modeName) {
    const id = ++attempt;
    clearTimeout(timer);
    video.pause();
    events = []; failure = ''; mode = modeName; started = performance.now();
    document.querySelectorAll('button[data-mode]').forEach(button => button.setAttribute('aria-pressed', String(button.dataset.mode === mode)));
    if (mode === 'hls' && !supportsHls) {
      status.textContent = '当前浏览器不支持原生分段播放，请试 MP4。'; refresh(); return;
    }
    video.src = mode === 'hls' ? './assets/films/361-hls/index.m3u8' : './assets/films/361.mp4';
    video.load();
    status.textContent = '正在连接影片…'; refresh();
    video.play().catch(error => {
      if (attempt !== id) return;
      failure = error.name;
      status.textContent = error.name === 'NotAllowedError' ? '浏览器未开始播放，请点击画面内的播放三角。' : '播放未能开始：' + error.name;
      refresh();
    });
    timer = setTimeout(() => {
      if (id !== attempt || video.currentTime > 0) return;
      status.textContent = video.readyState ? '已收到影片信息，仍在等待画面。' : '等待超过 12 秒，仍未收到影片信息。';
      refresh();
    }, 12000);
  }
  document.querySelectorAll('button[data-mode]').forEach(button => button.addEventListener('click', () => play(button.dataset.mode)));
  for (const event of ['loadstart','loadedmetadata','loadeddata','playing','waiting','stalled','error','ended']) video.addEventListener(event, () => {
    events.push(event + '@' + ((performance.now() - started) / 1000).toFixed(1) + 's'); events = events.slice(-10);
    if (event === 'playing') { clearTimeout(timer); status.textContent = '已开始播放。'; }
    if (event === 'ended') status.textContent = '影片已播完。';
    if (event === 'error') status.textContent = '视频连接或解码失败，错误代码：' + video.error?.code;
    refresh();
  });
  video.addEventListener('timeupdate', refresh);
  addEventListener('pagehide', () => { clearTimeout(timer); video.pause(); video.removeAttribute('src'); video.load(); });
  refresh();
</script>
</html>
