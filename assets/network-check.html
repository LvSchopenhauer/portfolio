<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>连接检查 · sphr</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 48px 22px; background: #191919; color: #eee; font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { max-width: 620px; margin: auto; }
    h1 { margin: 0 0 12px; font-size: 28px; font-weight: 500; }
    p { color: #aaa; }
    ul { list-style: none; margin: 32px 0; padding: 0; }
    li { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 15px 0; border-bottom: 1px solid #333; }
    li span:last-child { color: #aaa; text-align: right; }
    li[data-result="pass"] span:last-child { color: #b9d9bd; }
    li[data-result="fail"] span:last-child { color: #f6aa9f; }
    button { min-height: 44px; padding: 10px 18px; border: 1px solid #777; border-radius: 4px; background: transparent; color: inherit; font: inherit; cursor: pointer; }
    button:focus-visible { outline: 2px solid #eee; outline-offset: 4px; }
    pre { padding: 18px; border: 1px solid #444; color: #ccc; font: 12px/1.8 ui-monospace, monospace; white-space: pre-wrap; overflow-wrap: anywhere; }
    a { color: inherit; }
  </style>
</head>
<body>
  <main>
    <h1>连接检查</h1>
    <p>请保持联通 5G 和当前浏览器。检查会自动开始，约 30 秒内结束；把下方结果文字发给我即可。</p>
    <p id="summary" role="status" aria-live="polite">正在准备检查…</p>
    <ul id="checks" aria-label="检查结果"></ul>
    <button id="copy" type="button" disabled>复制结果</button>
    <pre id="report">等待检查结果…</pre>
    <p>本页只请求本站资源，不记录 IP、定位或设备标识，不会自动上传检查结果。</p>
    <p><a href="/">返回首页</a></p>
    <noscript><p>浏览器未运行 JavaScript。主站交互也需要 JavaScript，请检查浏览器的相关设置。</p></noscript>
  </main>
  <script>
    const tests = [
      { name: 'Cloudflare 连接', url: '/cdn-cgi/trace', kind: 'trace' },
      { name: '首页文件', url: '/?network-check=20261030', kind: 'html' },
      { name: '页面样式', url: '/css/styles.css?v=20261030-release', kind: 'css' },
      { name: '排版样式', url: '/css/typography.css?v=20261030-release', kind: 'css' },
      { name: '主脚本', url: '/js/main.js?v=20261030-mobile-startup', kind: 'js' },
      { name: '排版脚本', url: '/js/typography.js', kind: 'js' },
      { name: '布局脚本', url: '/js/block-spacing.js', kind: 'js' },
      { name: '项目资料', url: '/data/eqlz.json', kind: 'json' },
      { name: '图片连接（64 KB）', url: '/assets/covers/cover_1.png', kind: 'image' }
    ];
    const rows = tests.map(test => {
      const row = document.createElement('li');
      const label = document.createElement('span');
      label.textContent = test.name;
      const status = document.createElement('span');
      status.textContent = '检查中…';
      row.append(label, status);
      document.querySelector('#checks').append(row);
      return { row, status };
    });
    const results = new Array(tests.length);
    const startedAt = new Date().toISOString();
    let colo = '未取得';
    let active = 0;
    function updateReport() {
      const finished = results.filter(Boolean).length;
      const failures = results.filter(result => result && !result.ok).length;
      document.querySelector('#summary').textContent = finished === tests.length
        ? `检查结束：${finished - failures} 项通过，${failures} 项失败。`
        : `已完成 ${finished} / ${tests.length} 项检查…`;
      document.querySelector('#report').textContent = [
        'sphr 连接检查 v1', `时间：${startedAt}`, `服务节点：${colo}`,
        ...results.filter(Boolean).map(result => `${result.name}：${result.message}`)
      ].join('\n');
      document.querySelector('#copy').disabled = finished !== tests.length;
    }
    async function run(test, index) {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 15000);
      const start = performance.now();
      try {
        const response = await fetch(test.url, {
          cache: 'no-store', signal: controller.signal,
          headers: test.kind === 'image' ? { Range: 'bytes=0-65535' } : {}
        });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const contentType = response.headers.get('content-type') || '';
        let detail = '';
        if (test.kind === 'image') {
          const buffer = new Uint8Array(await response.arrayBuffer());
          if (buffer[0] !== 137 || buffer[1] !== 80 || buffer[2] !== 78 || buffer[3] !== 71) throw new Error('返回内容不是预期图片');
        } else {
          const text = await response.text();
          if (test.kind !== 'html' && contentType.includes('text/html')) throw new Error('返回了网页，未取得所需资源');
          if (test.kind === 'trace') {
            colo = text.match(/^colo=([^\r\n]+)/m)?.[1] || '未取得';
            detail = `，节点 ${colo}`;
          }
          if (test.kind === 'json') JSON.parse(text);
          if (test.kind === 'html') detail = text.includes('20261030-mobile-startup') ? '，已是修复版本' : '，未检测到修复版本';
        }
        const message = `通过，${((performance.now() - start) / 1000).toFixed(2)} 秒${detail}`;
        results[index] = { name: test.name, ok: true, message };
        rows[index].row.dataset.result = 'pass';
        rows[index].status.textContent = message;
      } catch (error) {
        const message = error.name === 'AbortError' ? '15 秒内未完成（超时）' : `失败：${error.message}`;
        results[index] = { name: test.name, ok: false, message };
        rows[index].row.dataset.result = 'fail';
        rows[index].status.textContent = message;
      } finally {
        clearTimeout(timer);
        updateReport();
      }
    }
    // Keep concurrency bounded so this check does not itself flood a slow connection.
    Promise.all(Array.from({ length: 5 }, async () => {
      while (active < tests.length) {
        const index = active++;
        await run(tests[index], index);
      }
    }));
    document.querySelector('#copy').addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(document.querySelector('#report').textContent);
        document.querySelector('#copy').textContent = '已复制';
      } catch {
        document.querySelector('#copy').textContent = '请长按下方文字复制';
      }
    });
  </script>
</body>
</html>
